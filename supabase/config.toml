project_id = "voxa-os"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
major_version = 17
[db.seed]
enabled = true
sql_paths = ["./seed.sql", "./seed-core.sql"]
[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "http://127.0.0.1:3000/auth/callback"]
jwt_expiry = 3600
enable_signup = false
[auth.email]
enable_signup = false
enable_confirmations = true
[auth.rate_limit]
sign_in_sign_ups = 10
token_refresh = 150
[studio]
enabled = true
port = 54323
