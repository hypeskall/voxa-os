User clamav
LocalSocket /run/clamav/clamd.sock
LocalSocketGroup clamav
LocalSocketMode 660
FixStaleSocket yes
Foreground yes
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp/clamav
StreamMaxLength 21M
MaxScanSize 100M
MaxFileSize 21M
MaxRecursion 16
MaxThreads 2
MaxQueue 8
ReadTimeout 20
CommandReadTimeout 10
SendBufTimeout 1000
AlertExceedsMax yes
AlertEncrypted yes
LogSyslog no
LogTime no
LogVerbose no
SelfCheck 60
