name: Voxa OS notification worker

on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: voxa-notification-worker
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      VOXA_APP_ORIGIN: ${{ vars.VOXA_APP_ORIGIN }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Process due notifications
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$VOXA_APP_ORIGIN" =~ ^https://[^/?#]+/?$ ]]; then
            echo "Set the VOXA_APP_ORIGIN repository variable to the production HTTPS origin."
            exit 1
          fi
          if [[ -z "$CRON_SECRET" ]]; then
            echo "Set the CRON_SECRET repository secret to match Vercel."
            exit 1
          fi
          origin="${VOXA_APP_ORIGIN%/}"
          curl --fail --silent --show-error --max-time 120 \
            --request POST \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            --output /dev/null \
            "${origin}/api/internal/notifications/process"
